name: Android Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '25.0.8775105'
  CMAKE_VERSION: '3.22.1'

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "cmake;${{ env.CMAKE_VERSION }}"

      - name: Build release
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign APK
        id: sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out_dir=app/build/outputs/apk/release
          src_apk=$(ls "$out_dir"/*.apk | grep -v -- '-signed' | head -n 1)
          echo "Input APK: $src_apk"

          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          apksigner="$build_tools/apksigner"

          if [ -n "${SIGNING_KEY:-}" ] && [ -n "${ALIAS:-}" ] && [ -n "${KEY_STORE_PASSWORD:-}" ]; then
            echo "Signing with repository secrets."
            echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KEY_STORE_PASSWORD" \
              --key-pass "pass:${KEY_PASSWORD:-$KEY_STORE_PASSWORD}" \
              --out "$out_dir/Anywhere-release-signed.apk" \
              "$src_apk"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Signing secrets are not configured, falling back to the debug key. The APK is installable but not suitable for distribution."
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/debug.jks" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/debug.jks" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$out_dir/Anywhere-release-debug-signed.apk" \
              "$src_apk"
          fi

          "$apksigner" verify --verbose "$out_dir"/*signed.apk
          echo "apk=$(ls "$out_dir"/*signed.apk | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: anywhere-release-${{ github.sha }}
          path: ${{ steps.sign.outputs.apk }}
          if-no-files-found: error

      - name: Upload proguard mapping
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign.outputs.apk }}
          generate_release_notes: true
